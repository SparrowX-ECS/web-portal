project:
  name: sparrowx
  environment: dev

appStack:
  state: enabled
  
service:
  name: web-portal

image:
  nameSpace: sparrowx/dev
  repository: webportal

container:
  port: 8080
  size: micro

deployment:
  desiredCount: 1

loadBalancer:
  pathPattern: /*
  listenerRulePriority: 500
  healthCheckPath: /health
  smokeTestPath: /health

database:
  enabled: false

frontend:
  apiBaseUrl: https://sparrowx-dev.mo2cloud.com
  corsAllowOrigins: '*'
